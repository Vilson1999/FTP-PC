name: Build & Publish GitHub Release APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag (e.g. v1.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release-apks:
    name: Build & Release ARMv7, ARMv8 & Universal APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & accept licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER (SDK_DIR=$SDK_DIR)"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true
          set -o pipefail
          if [ ! -f "$SDK_DIR/licenses/android-sdk-license" ]; then
            echo "Android SDK license acceptance failed!"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore cached signing keystore (fallback when secrets unset)
        uses: actions/cache@v5
        with:
          path: .ci-signing
          key: ftppc-fallback-keystore-v1

      - name: Configure release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using release keystore from repository secrets."
          else
            FALLBACK_PASS="ftppc-release-signing"
            mkdir -p "${{ github.workspace }}/.ci-signing"
            KEYSTORE_FILE="${{ github.workspace }}/.ci-signing/my-upload-key.jks"
            if [ ! -f "$KEYSTORE_FILE" ]; then
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_FILE" \
                -storepass "$FALLBACK_PASS" \
                -keypass "$FALLBACK_PASS" \
                -alias upload \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Vilson Sonkar, O=FTP PC, C=IN"
              echo "Generated new fallback keystore and caching it for future update builds."
            else
              echo "Reusing cached fallback keystore so APK updates install cleanly over previous versions."
            fi
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

      - name: Determine release version (update-compatible)
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          BASE_VER="1.0"
          CODE=$((100 + ${{ github.run_number }}))
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            VER="${TAG#v}"
          else
            VER="${BASE_VER}.${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building release $TAG (versionName=$VER, versionCode=$CODE)"

      - name: Run FTP engine unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.FtpServerEngineTest" --tests "com.example.ExampleUnitTest" --no-daemon

      - name: Build compressed Release APKs (ARMv7, ARMv8 & Universal)
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify ARMv7, ARMv8, and Universal release APKs were generated
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/release"
          ls -lh "$APK_DIR"
          ARMV7_APK=$(find "$APK_DIR" -maxdepth 1 -name "*armeabi-v7a*release*.apk" | head -n 1)
          ARMV8_APK=$(find "$APK_DIR" -maxdepth 1 -name "*arm64-v8a*release*.apk" | head -n 1)
          UNIVERSAL_APK=$(find "$APK_DIR" -maxdepth 1 -name "*universal*release*.apk" | head -n 1)
          if [ -z "$ARMV7_APK" ] || [ -z "$ARMV8_APK" ] || [ -z "$UNIVERSAL_APK" ]; then
            echo "Expected separate armeabi-v7a, arm64-v8a, and universal release APKs!"
            exit 1
          fi
          mkdir -p dist-apks/armv7 dist-apks/armv8 dist-apks/universal
          cp "$ARMV7_APK" dist-apks/armv7/ftp-pc-armv7-release.apk
          cp "$ARMV8_APK" dist-apks/armv8/ftp-pc-arm64-v8a-release.apk
          cp "$UNIVERSAL_APK" dist-apks/universal/ftp-pc-universal-release.apk

      - name: Upload ARMv7 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftp-pc-armv7-release-apk
          path: dist-apks/armv7/ftp-pc-armv7-release.apk
          if-no-files-found: error

      - name: Upload ARMv8 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftp-pc-arm64-v8a-release-apk
          path: dist-apks/armv8/ftp-pc-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftp-pc-universal-release-apk
          path: dist-apks/universal/ftp-pc-universal-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          NOTES="FTP PC $TAG (versionName ${APP_VERSION_NAME}, versionCode ${APP_VERSION_CODE}) — ARMv7, ARMv8 (arm64-v8a), and Universal release APKs. Installs directly over older versions signed with the same key. Developer: Vilson Sonkar."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist-apks/armv7/ftp-pc-armv7-release.apk \
              dist-apks/armv8/ftp-pc-arm64-v8a-release.apk \
              dist-apks/universal/ftp-pc-universal-release.apk \
              --clobber
          else
            gh release create "$TAG" \
              dist-apks/armv7/ftp-pc-armv7-release.apk \
              dist-apks/armv8/ftp-pc-arm64-v8a-release.apk \
              dist-apks/universal/ftp-pc-universal-release.apk \
              --target "${{ github.sha }}" \
              --title "FTP PC $TAG" \
              --notes "$NOTES" \
              --latest
          fi
