name: Build Release APKs (ARMv7 & ARMv8)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release-apks:
    name: Build ARMv7 & ARMv8 Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Configure release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            FALLBACK_PASS="ftppc-release-signing"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$FALLBACK_PASS" \
              -keypass "$FALLBACK_PASS" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Vilson Sonkar, O=FTP PC, C=IN"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run FTP engine unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.FtpServerEngineTest" --tests "com.example.ExampleUnitTest" --no-daemon

      - name: Build compressed Release APKs (ARMv7 & ARMv8 only)
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify only ARMv7 and ARMv8 release APKs were generated
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/release"
          ls -lh "$APK_DIR"
          ARMV7_APK=$(find "$APK_DIR" -maxdepth 1 -name "*armeabi-v7a*release*.apk" | head -n 1)
          ARMV8_APK=$(find "$APK_DIR" -maxdepth 1 -name "*arm64-v8a*release*.apk" | head -n 1)
          if [ -z "$ARMV7_APK" ] || [ -z "$ARMV8_APK" ]; then
            echo "Expected separate armeabi-v7a and arm64-v8a release APKs!"
            exit 1
          fi
          mkdir -p dist-apks/armv7 dist-apks/armv8
          cp "$ARMV7_APK" dist-apks/armv7/ftp-pc-armv7-release.apk
          cp "$ARMV8_APK" dist-apks/armv8/ftp-pc-arm64-v8a-release.apk

      - name: Upload ARMv7 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftp-pc-armv7-release-apk
          path: dist-apks/armv7/ftp-pc-armv7-release.apk
          if-no-files-found: error

      - name: Upload ARMv8 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftp-pc-arm64-v8a-release-apk
          path: dist-apks/armv8/ftp-pc-arm64-v8a-release.apk
          if-no-files-found: error
