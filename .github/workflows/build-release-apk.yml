name: Build Release APKs (ARMv7, ARMv8 & Universal)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release-apks:
    name: Build ARMv7, ARMv8 & Universal Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & accept licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER (SDK_DIR=$SDK_DIR)"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true
          set -o pipefail
          if [ ! -f "$SDK_DIR/licenses/android-sdk-license" ]; then
            echo "Android SDK license acceptance failed!"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Configure release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            FALLBACK_PASS="ftppc-release-signing"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$FALLBACK_PASS" \
              -keypass "$FALLBACK_PASS" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Vilson Sonkar, O=FTP PC, C=IN"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run FTP engine unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.FtpServerEngineTest" --tests "com.example.ExampleUnitTest" --no-daemon

      - name: Build compressed Release APKs (ARMv7, ARMv8 & Universal)
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify ARMv7, ARMv8, and Universal release APKs were generated
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/release"
          ls -lh "$APK_DIR"
          ARMV7_APK=$(find "$APK_DIR" -maxdepth 1 -name "*armeabi-v7a*release*.apk" | head -n 1)
          ARMV8_APK=$(find "$APK_DIR" -maxdepth 1 -name "*arm64-v8a*release*.apk" | head -n 1)
          UNIVERSAL_APK=$(find "$APK_DIR" -maxdepth 1 -name "*universal*release*.apk" | head -n 1)
          if [ -z "$ARMV7_APK" ] || [ -z "$ARMV8_APK" ] || [ -z "$UNIVERSAL_APK" ]; then
            echo "Expected separate armeabi-v7a, arm64-v8a, and universal release APKs!"
            exit 1
          fi
          mkdir -p dist-apks/armv7 dist-apks/armv8 dist-apks/universal
          cp "$ARMV7_APK" dist-apks/armv7/ftp-pc-armv7-release.apk
          cp "$ARMV8_APK" dist-apks/armv8/ftp-pc-arm64-v8a-release.apk
          cp "$UNIVERSAL_APK" dist-apks/universal/ftp-pc-universal-release.apk

      - name: Upload ARMv7 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftp-pc-armv7-release-apk
          path: dist-apks/armv7/ftp-pc-armv7-release.apk
          if-no-files-found: error

      - name: Upload ARMv8 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftp-pc-arm64-v8a-release-apk
          path: dist-apks/armv8/ftp-pc-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ftp-pc-universal-release-apk
          path: dist-apks/universal/ftp-pc-universal-release.apk
          if-no-files-found: error
